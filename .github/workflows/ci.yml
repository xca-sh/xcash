name: CI

# 本项目是加密货币支付网关，且接受外部 PR。质量门禁此前完全依赖开发者本机的
# pre-commit，任何 --no-verify 或未安装 pre-commit 的贡献者都能绕过。
# 这里把 lint / 测试 / 迁移检查 / 镜像构建统一放到 CI，作为唯一强制关口。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新提交取消上一次未完成的运行，避免排队浪费。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 生产镜像。必须是公开包：开源部署方的服务器匿名拉取，不做 docker login。
  IMAGE: ghcr.io/xca-sh/xcash

jobs:
  lint:
    name: Lint (ruff + black + import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv 自 v8 起不再维护 v9 这类浮动 major tag，只能钉具体版本，
      # 后续升级交给 dependabot 的 github-actions 分组跟进。
      # prune-cache 在 v9 把默认值从 true 改成了 false（缓存更大、恢复更快），
      # 这里显式设回 true 保持原有缓存体积，避免吃满仓库的 Actions 缓存配额。
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          prune-cache: true

      # --locked：pyproject 改了却没同步 uv.lock 时直接失败。锁文件漂移会让
      # CI 与生产镜像装到不同版本，必须在这里掐住。
      - name: 安装依赖
        run: uv sync --group dev --locked

      - name: ruff
        run: uv run ruff check --output-format=github .

      # black 是本项目唯一的格式化器（见 .pre-commit-config.yaml）。
      - name: black
        run: uv run black --check --diff .

      - name: 模块分层（import-linter）
        run: uv run lint-imports
        env:
          PYTHONPATH: xcash

  test:
    name: Test (pytest + 迁移检查)
    runs-on: ubuntu-latest

    # 版本与 docker-compose.yml 保持一致，避免「CI 过了、生产挂了」的版本差。
    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_DB: xcash
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d xcash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_DB: xcash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"

    steps:
      # fetch-depth: 0 —— django-migration-linter 要按 origin/main 求迁移文件差集，
      # 浅克隆下拿不到该 ref，脚本会退化成 HEAD（等于什么都不检查）。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 钉具体版本与 prune-cache 的理由同 lint job。
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          prune-cache: true

      - name: 安装依赖
        run: uv sync --group dev --locked

      - name: 模型与迁移文件是否一致
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      # 迁移向后兼容检查。lintmigrations 内部要跑 sqlmigrate，因此必须有可连的 DB，
      # 只能放在本 job（lint job 没有 service 容器）。
      - name: 迁移向后兼容检查
        run: ./scripts/dev-lint-migrations.sh

      # 带真实迁移跑（--create-db 而非默认的 --reuse-db）：这样每次 CI 都顺带验证
      # 全部迁移能在空库上干净应用一遍，与 upgrade.sh 的迁移演练形成前后两道防线。
      - name: pytest
        run: uv run pytest -q --create-db

      # 生产 settings 的部署自检：HSTS / cookie secure / DEBUG 等配置回退会在这里暴露。
      # 环境变量给占位值即可，本步骤不连真实外部服务。
      - name: 生产配置 check --deploy
        run: uv run python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          # 长度需 >= 50 且字符足够分散，否则会多出一条 security.W009 噪音警告。
          DJANGO_SECRET_KEY: Ci7Placeholder9Secret4Key2Never6Used8At0Runtime3Xq5Zw1Vb
          SITE_DOMAIN: ci.example.com
          WALLET_MNEMONIC_ENCRYPTION_KEY: ci-placeholder-wallet-key
          TRUSTED_PROXY_IPS: 127.0.0.1

  frontend:
    name: Frontend (pay-fronted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本由 pay-fronted/package.json 的 packageManager 字段决定，不在此重复声明。
      # 但必须显式指出该文件的位置：action 默认只读仓库根目录的 package.json，
      # 而本项目根目录没有这个文件，缺了这行会以 "No pnpm version is specified" 直接失败。
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: pay-fronted/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pay-fronted/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        working-directory: pay-fronted

      - name: eslint
        run: pnpm lint
        working-directory: pay-fronted

      # 只验证能构建通过，【不】比对产物与已入库的 xcash/static/pay 是否一致：
      # Vite 产物在不同 Node/平台下会有细微差异，做 diff 会频繁误报。
      # 「改了前端忘了跑 scripts/build-pay-fronted.sh」仍需人工把关。
      - name: 构建
        run: pnpm build
        working-directory: pay-fronted

  docker:
    name: Docker 生产镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 构建 python-run-stage 会连带构建 python-build-stage，一次覆盖 Dockerfile
      # 全部阶段（含镜像内 collectstatic 与 compilemessages）。只构建、不推送。
      # 缓存与 publish 的 amd64 共用 scope：main 推送时发布构建可直接命中本 job 的缓存。
      - name: 构建生产镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./compose/production/django/Dockerfile
          target: python-run-stage
          push: false
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max

  # 发布生产镜像到 GHCR：服务器只拉取、不构建（docker-compose.yml 引用 ${IMAGE}:latest）。
  # 只在 main 推送且全部检查通过后发布，没过 CI 的提交不会成为用户升级拿到的版本。
  # fork 仓库没有本仓库 GHCR 的写权限，按仓库名跳过。
  # 两种架构各在原生 runner 上构建（arm64 不走 QEMU 模拟），按 digest 推送后，
  # 由 publish-manifest 合并成同一个多架构 latest。
  publish:
    name: 发布镜像 (${{ matrix.arch }})
    if: github.event_name == 'push' && github.repository == 'xca-sh/xcash'
    needs: [lint, test, frontend, docker]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 只取 OCI 标签（source / revision 等），tag 由 publish-manifest 统一打。
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./compose/production/django/Dockerfile
          target: python-run-stage
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - name: 记录 digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: 发布镜像 latest
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 两个架构的 digest 合并成一个 manifest list 后才打 latest：任一架构构建失败，
      # 本 job 不会运行，latest 保持上一个完整版本，不会出现只更新了单一架构的 latest。
      - name: 合并多架构并打 latest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: 查看发布结果
        run: docker buildx imagetools inspect "${IMAGE}:latest"

  # 镜像包必须公开，部署方服务器才能匿名拉取。包关联到本公开仓库，实测首次发布即为
  # Public（公开后不可再改回私有）。本 job 不登录任何 registry：这里读不到，部署方
  # 服务器同样拉不到，CI 直接标红提醒。
  verify-public:
    name: 校验镜像可匿名拉取
    needs: publish-manifest
    runs-on: ubuntu-latest
    steps:
      - name: 匿名读取 latest
        run: docker buildx imagetools inspect "${IMAGE}:latest"
