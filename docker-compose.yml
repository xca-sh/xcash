name: xcash

volumes:
  redis_data: {}
  db_data: {}

# 同机 SaaS 等可信服务通过加入 xcash_public 按 DNS 别名互通（如 http://xcash-caddy）。
# xcash 自己总是创建该网络；即便没有外部服务加入也不影响本项目正常运行。
networks:
  default:
  xcash_public:
    name: xcash_public

# 容器日志不受宿主 logrotate 管辖，json-file 驱动默认【不限量】：生产是 structlog
# JSON + INFO 级别，长期运行会把宿主磁盘吃满，进而拖垮 Postgres 写入。全部服务统一
# 挂这份上限（每服务最多 150MB）。需要长期留存与检索时，请在宿主侧接日志采集链路，
# 而不是靠放大这里的上限。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# 【healthcheck 约定】只配给被 `depends_on: condition: service_healthy` 消费的服务，即 db
# 与 redis——它们门控 django/worker/worker-scan/beat 的启动时机，是功能件。应用服务有意不配：
# Compose 不会因 unhealthy 做任何事（自动重启是 Swarm 能力），状态仅供 `ps` 展示，却要付出
# 常驻开销（celery inspect ping 每次需拉起完整 Django + Celery 进程，实测约 69MB RSS）。
# 应用存活由容器外部的 HTTP 探针监测：GET /health、GET /health/scanning。
#
# django / worker / beat 三者共享的部分。抽成独立扩展字段而非挂在 django 服务上，
# 是为了让「哪个服务有 container_name」由各服务自己声明，
# 不必先继承再用 !reset 取消（那种写法既依赖较新的 Compose 版本，也难读）。
x-django-base: &django-base
  build:
    context: .
    dockerfile: ./compose/production/django/Dockerfile
    target: python-run-stage
  restart: unless-stopped
  logging: *default-logging
  # 依赖就绪后才启动，避免首次部署时 migrate 撞上尚未初始化完成的 Postgres。
  # entrypoint 里的 wait-for-it 仍然保留：upgrade.sh 用 `run --no-deps` 跑一次性
  # manage.py 命令，那条路径不经过 depends_on 门控，仍需自己等依赖。
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  # 主环境文件含 WALLET_MNEMONIC_ENCRYPTION_KEY（钱包助记词加密密钥）。
  # 地址派生与 EVM 签名在主系统内部完成，worker/beat 经该基底继承同一份配置。
  env_file:
    - ${ENV_FILE:-.env}
  # django/worker/beat 都需要按 DNS 别名解析 saas 侧 Caddy：
  # django 同步校验 SaaS permission，worker 推送内部回调，beat 调度刷新任务。
  networks: [default, xcash_public]

services:
  redis:
    image: redis:8.2.1
    container_name: xcash_redis
    restart: unless-stopped
    logging: *default-logging
    # maxmemory 给缓存 + broker 共用实例设上限，避免无限增长打爆主机。
    #
    # 淘汰策略必须是 noeviction：本实例里带 TTL、因而可被 volatile-lru 淘汰的键
    # 只有 singleton_task 的互斥锁与限流键，总量 KB 级——淘汰它们在 broker 队列
    # 面前腾不出任何有意义的空间，却会让金融任务的互斥与限流【静默失效】，系统
    # 看起来还在工作而保护已经没了。noeviction 下同样的内存压力表现为 cache 写入
    # 直接抛错、任务显式失败、日志可见。金融系统里显式失败优于静默失效。
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - redis_data:/data

  db:
    image: postgres:18.4-trixie
    container_name: xcash_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: xcash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      # 就绪探测必须走 TCP（-h 127.0.0.1）而非 pg_isready 默认的 Unix socket：
      # postgres 官方镜像首次初始化会先起一个【仅监听 socket】的临时实例跑建库脚本，
      # socket 版探测会在临时实例阶段就报就绪，使依赖方撞上「临时实例→正式实例」
      # 切换窗口而偶发连接失败。同 scripts/upgrade.sh 里 wait_for_postgres 的理由。
      test:
        ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - db_data:/var/lib/postgresql

  migration-rehearsal-db:
    image: postgres:18.4-trixie
    container_name: xcash_migration_rehearsal_db
    profiles: ["migration-rehearsal"]
    logging: *default-logging
    environment:
      POSTGRES_DB: xcash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  django:
    <<: *django-base
    container_name: xcash_django
    command: /start

  # 业务 worker：只消费 celery 队列。与 worker-scan 分开是为了做执行容量隔离——
  # 扫描任务受链 RPC 延迟支配（硬超时 50s），与它同池时链节点一旦劣化，广播、确认、
  # Webhook 这些业务任务会被一起饿死。
  worker:
    <<: *django-base
    # 【有意不设 container_name】：固定容器名会让 `docker compose up -d --scale worker=N`
    # 因名字冲突直接失败。worker 是本项目唯一需要横向扩容的无状态服务
    # （PERFORMANCE=high 下单容器 8 并发未必够），必须保留 --scale 能力。
    environment:
      REMAP_SIGTERM: SIGQUIT
      CELERY_WORKER_QUEUES: celery
    stop_grace_period: 60s
    command: /start-worker

  # 扫描 worker：只消费 scan 队列（CELERY_TASK_ROUTES 已把扫描任务路由到该队列）。
  # 同样不设 container_name，保留 --scale worker-scan=N 的能力；并发沿用 PERFORMANCE
  # 档位值，档位描述的是【单个 worker 容器】的并发，加容器与调档位是两条正交的路。
  worker-scan:
    <<: *django-base
    environment:
      REMAP_SIGTERM: SIGQUIT
      CELERY_WORKER_QUEUES: scan
    stop_grace_period: 60s
    command: /start-worker

  beat:
    <<: *django-base
    # 【container_name 必须保留】：它同时起到「禁止 --scale」的作用，不要为了扩容删掉。
    # beat 是全部定时任务的唯一投递源，跑 N 个实例会让每个周期任务被投递 N 遍，队列
    # 随即按倍数积压。worker / worker-scan 则相反：无状态、靠 Redis BRPOP 天然分流，
    # 可安全横向扩容。
    container_name: xcash_beat
    # beat 有意不配 healthcheck：Celery 没有给 beat 提供存活查询接口（inspect ping
    # 只对 worker 有效），任何探测都只能验证「进程在」，与 restart 策略的保障重复。
    command: /start-beat

  caddy:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
      target: caddy-run-stage
    container_name: xcash_caddy
    restart: unless-stopped
    logging: *default-logging
    # 用 service_started 而非 service_healthy：django 起不来时让 caddy 照常提供
    # 502，比整个入口拒连更容易定位问题。
    depends_on:
      django:
        condition: service_started
    environment:
      # 受信代理网段，决定 Caddy 是否采信宿主反代转发的真实客户端 IP 与协议。
      # 默认信任私有网段（宿主反代经 127.0.0.1:6688 接入时，对端是 Docker 网关）。
      # 若把 6688 对外暴露（LISTEN_TO=0.0.0.0），务必收紧为反代机的具体 IP。
      # 详见 compose/production/caddy/Caddyfile 顶部说明。
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-private_ranges}
    ports:
      - "${LISTEN_TO:-127.0.0.1}:6688:80"
    # 对外（公网）走端口映射，对内（SaaS 同机调用）通过 xcash_public 网络按 DNS 别名直连。
    networks:
      default: {}
      xcash_public:
        aliases:
          - xcash-caddy
