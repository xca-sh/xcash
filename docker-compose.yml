name: xcash

volumes:
  redis_data: {}
  db_data: {}

# 同机 SaaS 等可信服务通过加入 xcash_public 按 DNS 别名互通（如 http://xcash-caddy）。
# xcash 自己总是创建该网络；即便没有外部服务加入也不影响本项目正常运行。
networks:
  default:
  xcash_public:
    name: xcash_public

# 容器日志不受宿主 logrotate 管辖，json-file 驱动默认【不限量】：生产是 structlog
# JSON + INFO 级别，长期运行会把宿主磁盘吃满，进而拖垮 Postgres 写入。全部服务统一
# 挂这份上限（每服务最多 150MB）。需要长期留存与检索时，请在宿主侧接日志采集链路，
# 而不是靠放大这里的上限。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# 【healthcheck 约定】只配给被 `depends_on: condition: service_healthy` 消费的服务，即 db
# 与 redis——它们门控 django/worker/chain-runner 的启动时机，是功能件。应用服务有意不配：
# Compose 不会因 unhealthy 做任何事（自动重启是 Swarm 能力），状态仅供 `ps` 展示，却要付出
# 常驻开销（容器内探测每次都要拉起一个完整的 Django 进程）。
# 应用存活由外部 HTTP 探针监测：GET /health、/health/scanning、/health/workers。
#
# django / worker / chain-runner 共享配置，容器名由各服务单独声明。
x-django-base: &django-base
  # 应用镜像由 GitHub Actions 构建并发布到 GHCR（.github/workflows/ci.yml 的 publish），
  # 服务器只拉取、不构建；三个进程角色共享同一份镜像。首次 up 本地没有镜像时自动拉取，
  # 之后只有 scripts/upgrade.sh 会显式拉取新版，普通 up / 重启沿用本地已有的镜像。
  image: ghcr.io/xca-sh/xcash:latest
  restart: unless-stopped
  logging: *default-logging
  # 依赖就绪后才启动，避免首次部署时 migrate 撞上尚未初始化完成的 Postgres。
  # entrypoint 里的 wait-for-it 仍然保留：upgrade.sh 用 `run --no-deps` 跑一次性
  # manage.py 命令，那条路径不经过 depends_on 门控，仍需自己等依赖。
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  # 主环境文件含 WALLET_MNEMONIC_ENCRYPTION_KEY（钱包助记词加密密钥）。
  # 地址派生与 EVM 签名在主系统内部完成，worker/chain-runner 经该基底继承同一份配置。
  env_file:
    - ${ENV_FILE:-.env}
  # django/worker/chain-runner 都需要按 DNS 别名解析 saas 侧 Caddy：
  # django 后台刷新 SaaS permission 缓存，worker 推送内部回调与 gas 计费。
  networks: [default, xcash_public]

services:
  redis:
    image: redis:8.2.1
    container_name: xcash_redis
    restart: unless-stopped
    logging: *default-logging
    # Redis 只承担缓存、限流与签名 nonce；任务队列在 PostgreSQL（Procrastinate）。
    # maxmemory 给实例设上限，避免无限增长打爆主机。
    #
    # volatile-lru 在本实例是【泄压阀】，不要改成 noeviction：可淘汰的 TTL 键包括限流键、
    # 终态账单详情（1h）、SaaS 权限（1h）、AML 结果等一批可重建的缓存，量级足以在内存
    # 吃紧时腾出有意义的空间。换成 noeviction 后没有任何键可淘汰，到顶即全实例拒写：
    # 缓存写直接抛错、依赖 nonce 写入的签名 API 拒绝请求，而 redis-cli ping 仍报 healthy。
    # 也不改成 allkeys-lru：timeout=None 的配置型缓存（如 SaaS 权限）被淘汰后会 fail-open。
    #
    # AOF 保留：签名 nonce 跨 Redis 重启仍能防重放，限流计数保持连续。
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - redis_data:/data

  db:
    image: postgres:18.4-trixie
    container_name: xcash_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: xcash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      # 就绪探测必须走 TCP（-h 127.0.0.1）而非 pg_isready 默认的 Unix socket：
      # postgres 官方镜像首次初始化会先起一个【仅监听 socket】的临时实例跑建库脚本，
      # socket 版探测会在临时实例阶段就报就绪，使依赖方撞上「临时实例→正式实例」
      # 切换窗口而偶发连接失败。同 scripts/upgrade.sh 里 wait_for_postgres 的理由。
      test:
        ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - db_data:/var/lib/postgresql

  migration-rehearsal-db:
    image: postgres:18.4-trixie
    container_name: xcash_migration_rehearsal_db
    profiles: ["migration-rehearsal"]
    logging: *default-logging
    environment:
      POSTGRES_DB: xcash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  django:
    <<: *django-base
    container_name: xcash_django
    # 普通部署自动迁移并初始化；upgrade.sh 准备成功后用临时 override 跳过重复初始化。
    command: /start

  # 业务 worker：单进程线程池执行 PostgreSQL 任务队列（Procrastinate）里的任务，并由进程
  # 内置的 deferrer 按 cron 投递全部周期任务（取代 beat；周期投递由数据库去重，多开不会
  # 重复投递）。任一任务超过 300s 由看门狗打印线程栈并退出进程，restart 策略拉起，被中断
  # 的任务由 retry_stalled_jobs 回收重跑。链扫描与主动交易不在这里运行（见 chain-runner），
  # 链节点劣化不会占用确认、Webhook 这些业务任务的执行容量。
  # 可 --scale 多开（先移除 container_name）。数据库连接：任务线程数 + 1 条周期投递 + 至多
  # 4 条连接池 + 1 条 LISTEN。全栈连接需求还需加上 Web 进程数 × 4、每条活跃链的
  # ORM 连接与 chain-runner 的管理/锁连接；扩容前按实际链数核算 max_connections，
  # 并为升级和运维连接预留余量。
  worker:
    <<: *django-base
    container_name: xcash_worker
    # 大于看门狗硬上限 300s：SIGTERM 后等在途任务做完；超时被 SIGKILL 的任务会被回收。
    # upgrade.sh 在 worker 排空期间保留 Django，排空结束后才进入 HTTP 停机窗口。
    stop_grace_period: 330s
    command: /start-worker

  # 链扫描与主动交易：常驻进程，每条活跃链一个线程，循环执行扫描 → 终局轮询 → 派发
  # （xcash/chains/runner.py）。同一条链由 PG advisory lock 保证只有一个循环在跑；--scale
  # 多开时后到的实例抢不到锁就空转待命，前一个退出后数秒内接管。交接的几秒窗口里两个
  # 实例可能同时派发：EVM 同一 nonce 至多一笔上链，Tron 最坏对幂等的部署/归集多发一笔、
  # 多烧一次能量。默认单实例，container_name 保持固定；将来需要多开时先移除 container_name。
  chain-runner:
    <<: *django-base
    container_name: xcash_chain_runner
    # SIGTERM 后各链跑完当前一步（预算最长 40s，加一个单元的余量）再退出；超时被
    # SIGKILL 也安全：扫描进度按单元提交，入账按唯一键幂等。
    stop_grace_period: 120s
    command: /start-chain-runner

  caddy:
    image: caddy:2.11.4-alpine
    container_name: xcash_caddy
    restart: unless-stopped
    logging: *default-logging
    # 挂载【整个目录】而非单个 Caddyfile：git pull 更新文件时会换成新文件（新 inode），
    # 单文件挂载的容器会一直读到旧内容。Caddy 不监视配置文件，变更由 upgrade.sh 末尾
    # 的 caddy reload 平滑生效。
    volumes:
      - ./compose/production/caddy:/etc/caddy:ro
    # 用 service_started 而非 service_healthy：django 起不来时让 caddy 照常提供
    # 502，比整个入口拒连更容易定位问题。
    depends_on:
      django:
        condition: service_started
    environment:
      # 受信代理网段，决定 Caddy 是否采信宿主反代转发的真实客户端 IP 与协议。
      # 默认信任私有网段（宿主反代经 127.0.0.1:6688 接入时，对端是 Docker 网关）。
      # 若把 6688 对外暴露（LISTEN_TO=0.0.0.0），务必收紧为反代机的具体 IP。
      # 详见 compose/production/caddy/Caddyfile 顶部说明。
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-private_ranges}
    ports:
      - "${LISTEN_TO:-127.0.0.1}:6688:80"
    # 对外（公网）走端口映射，对内（SaaS 同机调用）通过 xcash_public 网络按 DNS 别名直连。
    networks:
      default: {}
      xcash_public:
        aliases:
          - xcash-caddy
