[tool.uv]
package = false

[project]
name = "xcash"
version = "0.6.0"
description = "Open-source self-hosted cryptocurrency payment gateway. Accept USDT, ETH. Zero platform fees, major EVM chains and Tron, Docker deploy, full self-custody."
requires-python = "==3.13.*"
dependencies = [
    "web3==7.16.0",
    "base58==2.1.1",
    "bip-utils==2.12.1",
    "redis==8.0.1",
    "hiredis==3.4.0",
    "cryptography==48.0.1",
    "argon2-cffi==25.1.0",
    "shortuuid==1.0.13",
    "httpx==0.28.1",
    # Django
    "django==5.2.16",
    "django-environ==0.14.0",
    "django-unfold==0.102.0",
    "djangorestframework==3.17.1",
    "django-redis==7.0.0",
    "django-cors-headers==4.9.0",
    "django-smart-ratelimit[redis]==4.12.1",
    # Celery
    "celery==5.6.3",
    "django-celery-results==2.6.0",
    # Logging
    "structlog==26.1.0",
    "gunicorn==26.0.0",
    # 迁移文件在模块顶层 import IgnoreMigration，production migrate 必须能加载该符号；
    # 仅 dev settings 把它加入 INSTALLED_APPS，production 装而不启用，运行时无副作用。
    "django-migration-linter==6.0.0",
]
[dependency-groups]
dev = [
    "psycopg[binary]==3.3.4",
    "celery-types==0.26.0",
    "django-extensions==4.1",
    "watchfiles==1.2.0",
    "werkzeug[watchdog]==3.1.8",
    "ipdb==0.13.13",
    # Testing
    "mypy==2.3.0",
    "django-stubs[compatible-mypy]==6.0.7",
    "pytest==9.1.1",
    "pytest-sugar==1.1.1",
    "djangorestframework-stubs[compatible-mypy]==3.17.1",
    # Code quality
    # black 是本项目唯一的格式化器（见 .pre-commit-config.yaml 的说明）；
    # 必须列在依赖里，否则本地 `uv run black` 不可用，只有 pre-commit 自建环境能跑。
    "black==25.12.0",
    "ruff==0.16.1",
    "coverage==7.15.2",
    "djlint==1.43.1",
    "pre-commit==4.6.1",
    # Django
    "django-debug-toolbar==6.3.0",
    "django-coverage-plugin==3.2.2",
    "pytest-django==4.12.0",
    "vulture==2.16",
]
production = [
    "psycopg[c]==3.3.4",
]

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
testpaths = ["xcash"]
python_files = [
    "tests.py",
    "test_*.py",
    "tests_*.py",
]
filterwarnings = [
    "ignore:websockets\\.legacy is deprecated;.*:DeprecationWarning",
]

# ==== Coverage ====
[tool.coverage.run]
include = ["xcash/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== mypy ====
# 现状说明：mypy 已可正常运行，但全库仍有数百处存量类型错误（check_untyped_defs
# 打开且历史代码从未被检查过）。因此它是【增量排查工具】而非 CI 门禁——
# CI 里不跑 mypy，避免引入一个永久失败的检查项。用法：`make typecheck`。
[tool.mypy]
# 按包名而非路径检查：xcash/ 自身也是包（有 __init__.py），若按路径传入，
# 同一文件会被同时解析为 xcash.common 和 common 两个模块名而直接报错中止。
packages = [
    "aml",
    "chains",
    "common",
    "config",
    "core",
    "currencies",
    "deposits",
    "evm",
    "invoices",
    "projects",
    "saas_api",
    "tron",
    "users",
    "webhooks",
]
# 只接受 x.y，写 x.y.z 会被 mypy 判为非法版本并放弃该配置。
python_version = "3.13"
# 各 app 以顶层包形式存在于 xcash/ 下（运行期由 base.py 的 sys.path.append 注入）。
# mypy 不认这个运行期 hack，必须显式告知，否则它解析不到 users.User 等模块：
# django-stubs 插件为 AUTH_USER_MODEL 解析 _AnyUser 时会无限 defer，
# 最终以 "Must not defer during final iteration" 崩溃（INTERNAL ERROR）而非报缺模块。
mypy_path = "xcash"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
# 必须指向 test settings：django-stubs 插件会在启动时真实导入该 settings 模块，
# dev/production 依赖 POSTGRES_PASSWORD 等外部环境变量，缺失时插件直接构造失败
# （mypy 报 INTERNAL ERROR）。test settings 用 os.environ.setdefault 自带全部默认值，
# 无需任何环境变量即可导入，故是唯一能让 mypy 开箱可用的选择。
django_settings_module = "config.settings.test"

# ==== black ====
# 本项目唯一的格式化器。line-length 不配置：black 默认 88，与 [tool.ruff] 一致。
[tool.black]
# 必须与 ruff 的 exclude 和 .pre-commit-config.yaml 的 exclude 保持一致地排除迁移文件。
# 否则口径不一：pre-commit 不格式化 migrations，而 CI 的 `black --check .` 会检查它们，
# Django 新生成的迁移一旦不符合 black 风格就会让 CI 无故变红。
extend-exclude = '/migrations/'

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
# ruff 在本项目【只做 lint】，格式化交给 black（见 .pre-commit-config.yaml）。
# 故此处不配置 [tool.ruff.format]：两个格式化器并存会互相改写同一批文件。
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*/migrations/*.py",
    "staticfiles/*"
]
# Same as Django: https://github.com/cookiecutter/cookiecutter-django/issues/4792.
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "DJ",
    "EM",
    "EXE",
    "FA",
    'ISC',
    "ICN",
    "G",
    'INP',
    'PIE',
    "T20",
    'PYI',
    'PT',
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TCH",
    "INT",
    # "ARG", # Unused function argument
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    # "NPY",
    # "AIR",
    "PERF",
    # "FURB",
    # "LOG",
    "RUF"
]
ignore = [
    "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "SIM102", # sometimes it's better to nest
    "PLR0913", # 限制参数为5个
    "E402", # import 必须在顶部
    "BLE001", # 异常捕获
    "RET505", # return后的else是不必要的，但本项目以代码逻辑清晰优先
    "SIM108",
    "E501", # Line too long
    "PGH004", # noqa
    "RUF001",
    "RUF002",
    "RUF003",
    "COM812", # 尾随逗号问题
    "PLR2004", # status code问题
    "RUF100", # noqa问题
    # 测试：项目使用 Django TestCase，必须用 unittest 风格断言（assertEqual/assertTrue 等）
    "PT009",
    "PT027",
    # 异常消息风格：项目全库直接在 raise 里写字符串，统一豁免
    "EM101",
    "EM102",
    "TRY003",
    # 测试/配置文件中的已知 hardcoded secret（测试凭据、设置默认值）
    "S105",
    "S106",
    # Django 测试里 _ 前缀参数模式，属于项目约定（49处）
    "PT019",
    # 测试代码 subprocess，属于预期行为
    "S603",
    # 跨层访问私有方法（service 调用 model 的 _helper 属于设计决策，非安全问题）
    "SLF001",
    # 中文注释常被误判为注释掉的代码，ERA001 在中文项目里误报率过高
    "ERA001",
    # 函数内 import（335 处），项目常用此技巧避免循环导入
    "PLC0415",
    # typing-only import（20 处），低价值性能优化
    "TC001",
    "TC003",
    # 未使用解包变量（11 处）
    "RUF059",
    # 函数复杂度过高（5 处），属于架构债
    "C901",
    # return/分支/语句过多（8 处），属于架构债
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "FBT003",
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
force-single-line = true
# 声明本地 app，确保排序为 stdlib → third-party → first-party
known-first-party = [
    "chains",
    "common",
    "config",
    "core",
    "currencies",
    "deposits",
    "evm",
    "invoices",
    "projects",
    "users",
    "webhooks",
]
