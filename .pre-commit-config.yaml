exclude: '^docs/|/migrations/|devcontainer.json'
default_stages: [ pre-commit ]

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.19.0'
    hooks:
      - id: django-upgrade
        args: [ '--target-version', '4.2' ]

  # Black 代码格式化（在 ruff lint 之前运行，确保格式先统一）
  # black / ruff 的 rev 必须与 pyproject.toml dev 依赖的版本一致，否则本地钩子与 CI 的
  # `uv run black/ruff` 规则不同，会出现钩子改完 CI 仍报错（或反之）。
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black

  # Ruff 静态检查（在 black 之后运行，此时格式已统一）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      # 只跑 linter：格式化由 black 独占，ruff-format 已移除以免两者互相打架
      - id: ruff-check
        args: [ --fix, --exit-non-zero-on-fix ]

  - repo: local
    hooks:
      - id: django-makemigrations-check
        name: Django makemigrations check
        entry: ./scripts/dev-manage.sh makemigrations --check --dry-run
        language: system
        pass_filenames: false
        always_run: true

      - id: django-migration-linter
        name: Django migration linter
        entry: ./scripts/dev-lint-migrations.sh
        language: system
        pass_filenames: false
        always_run: true

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  # 上面两个 local 钩子是 language: system，依赖本机的 uv 与 Django 环境，
  # pre-commit.ci 的沙箱里跑不起来。这两项由 GitHub Actions（.github/workflows/ci.yml）
  # 在装好依赖的环境里执行，此处必须跳过，否则启用 pre-commit.ci 即恒定失败。
  skip: [ django-makemigrations-check, django-migration-linter ]
  submodules: false
